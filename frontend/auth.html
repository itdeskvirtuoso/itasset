<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Authentication - IT Asset Manager</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Decoration -->
        <div class="auth-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="auth-card glass">
            <div class="auth-header">
                <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
                <div class="virtuoso-logo-container">
                    <h1 class="virtuoso-logo-text">VIRTUOSO</h1>
                </div>
                <h2>Welcome to Virtuoso</h2>
                <p id="auth-subtitle">Sign in to continue</p>
            </div>

            <!-- Toggle Buttons -->
            <div class="auth-toggle">
                <button class="toggle-btn active" id="btn-login" style="width: 100%; border-radius: 8px;">Login</button>
            </div>

            <div id="alert-message" class="alert-message" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="login-username" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye-slash toggle-password"
                            onclick="togglePasswordVisibility('login-password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="primary-btn full-width" id="login-submit">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Auth JS -->
    <script src="auth.js"></script>

    <script>
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.toggle('show-menu');
        }
    </script>
</body>

</html>
