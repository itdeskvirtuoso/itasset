<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Authentication - IT Asset Manager</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Design system -->
    <link rel="stylesheet" href="styles.css?v=27">
    <link rel="stylesheet" href="components.css?v=22">
    <link rel="stylesheet" href="auth.css?v=22">
    <!-- Confetti Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="auth-page" data-step="welcome">
    <div class="auth-rings" aria-hidden="true"></div>
    <div class="auth-floor" aria-hidden="true"></div>
    <div class="auth-rail" aria-hidden="true">Engineering · Control · Automation · Innovation</div>
    <div class="auth-tagline" aria-hidden="true">
        <span>Every Asset</span>
        <span>Tracked &amp;</span>
        <span>Secured</span>
    </div>

    <main class="auth-container">
        <div class="auth-card" id="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">
                    <img src="logo-wordmark.png" alt="Virtuoso" width="300" height="33">
                </h1>
                <p id="auth-subtitle">Sign in to continue</p>
                <div class="typewriter-container">
                    <span id="system-welcome-label" class="typewriter-text"></span><span
                        class="typewriter-cursor"></span>
                </div>
            </div>

            <ol class="auth-steps" aria-label="Sign-in progress">
                <li data-step="welcome"><span>1</span>Welcome</li>
                <li data-step="login"><span>2</span>Sign in</li>
                <li data-step="enter"><span>3</span>Dashboard</li>
            </ol>

            <div id="alert-message" class="alert-message" role="alert" hidden></div>

            <!-- Step 1: welcome swipe -->
            <div id="step-welcome" class="auth-panel">
                <div class="slide-container" id="slide-container">
                    <span class="slide-text">Slide to Login</span>
                    <div class="slide-fill" id="slide-fill"></div>
                    <button type="button" class="slide-thumb" id="slide-thumb"
                        aria-label="Slide to login, or press Enter">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
                <p class="auth-hint"><i class="fa-solid fa-lock"></i> Protected sign-in</p>
            </div>

            <!-- Step 2: credentials, checked by the server against the user database -->
            <form id="login-form" class="auth-form auth-panel" novalidate hidden>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username"
                            autocapitalize="none" spellcheck="false" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-actions">
                    <button type="button" id="login-back" class="secondary-btn">Back</button>
                    <button type="submit" class="primary-btn" id="login-submit">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <!-- Step 3: signed in, opening the dashboard -->
            <div id="step-success" class="auth-success auth-panel" aria-live="polite" hidden>
                <h2>Welcome, <span id="success-name"></span></h2>
                <p>Opening your dashboard…</p>
                <div class="auth-success-bar"></div>
            </div>
        </div>
    </main>

    <script src="auth.js?v=22"></script>
</body>

</html>
