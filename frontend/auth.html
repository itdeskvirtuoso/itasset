<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Authentication - IT Asset Manager</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Confetti Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Decoration -->
        <div class="auth-bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <div class="auth-card glass">
            <div class="auth-header">
                <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
                <style>
                    @keyframes crispShine {
                        to {
                            background-position: 200% center;
                        }
                    }

                    .animated-logo-text {
                        font-family: 'Syncopate', sans-serif;
                        font-size: 2.8rem;
                        font-weight: 700;
                        letter-spacing: 6px;
                        background: linear-gradient(to right, #1e293b 20%, #e11d48 40%, #e11d48 60%, #1e293b 80%);
                        background-size: 200% auto;
                        color: #1e293b;
                        /* Fallback */
                        background-clip: text;
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        animation: crispShine 3.5s linear infinite;
                        margin: 0;
                        padding-bottom: 5px;
                        /* Removed text-shadow and transform to prevent browser blurring */
                    }
                    /* Slide to Unlock Styles */
                    .slide-container {
                        width: 320px;
                        height: 60px;
                        background: rgba(30, 41, 59, 0.05);
                        border-radius: 30px;
                        position: relative;
                        box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
                        overflow: hidden;
                        border: 1px solid rgba(226, 232, 240, 0.8);
                        display: flex;
                        align-items: center;
                        margin-top: 15px;
                    }
                    .slide-text {
                        width: 100%;
                        text-align: center;
                        position: absolute;
                        font-weight: 700;
                        color: #64748b;
                        font-size: 1.05rem;
                        z-index: 1;
                        pointer-events: none;
                        animation: shimmerText 2.5s infinite;
                        background: linear-gradient(90deg, #64748b 0%, #cbd5e1 50%, #64748b 100%);
                        background-size: 200% auto;
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                    }
                    @keyframes shimmerText {
                        to { background-position: 200% center; }
                    }
                    .slide-fill {
                        position: absolute;
                        left: 0;
                        top: 0;
                        height: 100%;
                        width: 0;
                        background: linear-gradient(90deg, #e11d48, #be123c);
                        border-radius: 30px 0 0 30px;
                        z-index: 2;
                    }
                    .slide-thumb {
                        position: absolute;
                        left: 5px;
                        width: 50px;
                        height: 50px;
                        background: white;
                        border-radius: 50%;
                        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        color: #e11d48;
                        font-size: 1.2rem;
                        cursor: grab;
                        z-index: 3;
                        transition: transform 0.1s;
                    }
                    .typewriter-container {
                        margin-top: 10px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        min-height: 1.5rem; /* Reserve space so it doesn't jump */
                        width: 100%;
                    }
                    .typewriter-text {
                        font-family: 'Syncopate', sans-serif;
                        font-size: 0.6rem;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                        background: linear-gradient(90deg, #1e293b 0%, #e11d48 30%, #fb7185 50%, #e11d48 70%, #1e293b 100%);
                        background-size: 200% auto;
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        animation: textGradientShine 3s linear infinite;
                        white-space: nowrap; /* Prevent breaking into multiple lines */
                    }
                    .typewriter-cursor {
                        display: inline-block;
                        width: 3px;
                        height: 0.9em;
                        background-color: #e11d48;
                        animation: blinkCaret 0.75s step-end infinite;
                        margin-left: 3px;
                        box-shadow: 0 0 6px rgba(225, 29, 72, 0.5); /* subtle glow */
                        border-radius: 2px;
                    }
                    @keyframes textGradientShine {
                        to { background-position: 200% center; }
                    }
                    @keyframes blinkCaret {
                        from, to { opacity: 0; }
                        50% { opacity: 1; }
                    }
                </style>
                <div class="virtuoso-logo-container" style="margin-bottom: 10px;">
                    <h1 class="animated-logo-text">VIRTUOSO</h1>
                </div>
                <!-- Heading removed per user request -->
                <p id="auth-subtitle">Sign in to continue</p>
                <div class="typewriter-container">
                    <span id="system-welcome-label" class="typewriter-text"></span><span class="typewriter-cursor"></span>
                </div>
            </div>

            <!-- Step 1: Welcome -->
            <div id="step-welcome" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; transition: all 0.5s ease; opacity: 1; transform: scale(1);">
                <div class="slide-container" id="slide-container">
                    <span class="slide-text">Slide to Login</span>
                    <div class="slide-fill" id="slide-fill"></div>
                    <div class="slide-thumb" id="slide-thumb">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>

            <div id="alert-message" class="alert-message" style="display: none;"></div>

            <!-- Step 2: Login Form (Hidden initially) -->
            <form id="login-form" class="auth-form"
                style="display: none; opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="login-username"
                        style="font-weight: 600; font-size: 0.95rem; color: #475569; margin-bottom: 8px; display: block;">Username</label>
                    <div class="input-with-icon" style="position: relative;">
                        <i class="fa-regular fa-user"
                            style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;"></i>
                        <input type="text" id="login-username" placeholder="Enter your username" required
                            style="width: 100%; padding: 14px 14px 14px 45px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; color: #1e293b; background: rgba(255,255,255,0.8); transition: all 0.3s;"
                            onfocus="this.style.borderColor='var(--red-primary)'; this.style.boxShadow='0 0 0 4px rgba(225,29,72,0.1)';">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 30px;">
                    <label for="login-password"
                        style="font-weight: 600; font-size: 0.95rem; color: #475569; margin-bottom: 8px; display: block;">Password</label>
                    <div class="input-with-icon" style="position: relative;">
                        <i class="fa-solid fa-lock"
                            style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required
                            style="width: 100%; padding: 14px 45px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; color: #1e293b; background: rgba(255,255,255,0.8); transition: all 0.3s;"
                            onfocus="this.style.borderColor='var(--red-primary)'; this.style.boxShadow='0 0 0 4px rgba(225,29,72,0.1)';">
                        <i class="fa-regular fa-eye-slash toggle-password"
                            onclick="togglePasswordVisibility('login-password', this)"
                            style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer; transition: color 0.2s;"
                            onmouseover="this.style.color='var(--red-primary)'"
                            onmouseout="this.style.color='#64748b'"></i>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <button type="button" onclick="hideLoginForm()" class="secondary-btn"
                        style="flex: 1; padding: 14px; border-radius: 12px; font-weight: 600;">Back</button>
                    <button type="submit" class="primary-btn" id="login-submit"
                        style="flex: 2; padding: 14px; border-radius: 12px; font-weight: 600; box-shadow: 0 4px 15px rgba(225,29,72,0.3);">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Auth JS -->
    <script src="auth.js"></script>

    <script>
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.toggle('show-menu');
        }
    </script>
</body>

</html>
