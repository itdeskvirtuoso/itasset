<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading IT Asset Manager...</title>
    <!-- Auto-redirect to the frontend folder -->
    <meta http-equiv="refresh" content="0; url=./frontend/index.html">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #475569;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #e11d48;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Starting AssetPro IT...</h2>
        <p>Redirecting you to the dashboard instantly.</p>
    </div>
    <script>
        // Fallback JavaScript redirect just in case meta refresh fails
        setTimeout(() => {
            window.location.href = './frontend/index.html';
        }, 100);
    </script>
</body>
</html>
